      min_score: 90.0
    - name: "Very High"
      min_score: 75.0
    - name: "High"
      min_score: 60.0
    - name: "Moderate"
      min_score: 45.0
    - name: "Low"
      min_score: 30.0
    - name: "Very Low"
      min_score: 0.0
